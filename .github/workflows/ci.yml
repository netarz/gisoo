# Syntax checks for every example.
# This workflow never calls the Gisoo API and needs no key or secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Python (py_compile)
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile
      - name: Node.js (node --check)
        run: find . -name '*.mjs' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: JSON files parse
        run: find . -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Shell (shellcheck)
        run: shellcheck openai/*.sh anthropic/*.sh claude-code/*.sh
